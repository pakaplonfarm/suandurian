function thDate(d) {
  if (!d) return "–";
  const [y, m, dy] = d.split("-");
  const ms = ["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  return `${+dy} ${ms[+m]} ${+y + 543}`;
}

function TypeChip({ type }) {
  const map = {
    "ปุ๋ยทางดิน":  [T.g, T.g3, "#c4d4c0"],
    "ปุ๋ยทางใบ":  [T.teal, T.teal2, "#a8d0c8"],
    "ยาฆ่าแมลง": [T.amb, T.amb2, "#e8c890"],
    "ยาเชื้อรา":  [T.gold, T.gold2, "#e0c080"],
    "ปรับปรุงดิน":[T.sky, T.sky2, "#b0d0e0"],
    "อื่นๆ":      [T.txt3, T.surf2, T.bdr],
  };
  const [col, bg, bdr] = map[type] || [T.txt3, T.surf2, T.bdr];
  return (
    <span style={{
      display: "inline-block", padding: "3px 10px", borderRadius: 999,
      fontSize: ".68rem", fontWeight: 600, letterSpacing: ".01em",
      color: col, background: bg, border: `1px solid ${bdr}`,
    }}>{type}</span>
  );
}

// Numeric input that ALWAYS allows free typing (string state) — fixes the "can't delete 6" bug
function NumInput({ value, onChange, placeholder, min, max, step, style }) {
  return (
    <input
      type="text"
      inputMode="decimal"
      value={value}
      placeholder={placeholder}
      onChange={(e) => {
        const v = e.target.value;
        // Allow empty, digits, single decimal
        if (v === "" || /^[0-9]*\.?[0-9]*$/.test(v)) onChange(v);
      }}
      style={{
        width: "100%", background: T.surf, border: `1.5px solid ${T.bdr}`,
        borderRadius: 10, color: T.txt, fontFamily: "'Sarabun',sans-serif",
        fontSize: ".95rem", padding: "10px 13px", outline: "none",
        WebkitAppearance: "none", transition: "border-color .2s, box-shadow .2s",
        ...style,
      }}
      onFocus={(e) => { e.target.style.borderColor = T.g2; e.target.style.boxShadow = `0 0 0 3px ${T.g3}`; }}
      onBlur={(e) => { e.target.style.borderColor = T.bdr; e.target.style.boxShadow = "none"; }}
    />
  );
}

      onBlur={(e) => { e.target.style.borderColor = T.bdr; e.target.style.boxShadow = "none"; }}
    />
  );
}

function LogPage({ logs, setLogs, showToast, initFilter }) {
  const [form, setForm] = useState({
    date: new Date().toISOString().split("T")[0],

  const [ft, setFt] = useState(initFilter || "");

  // sync filter เมื่อมาจากการกดการ์ดบนหน้าภาพรวม
  useEffect(() => {
    if (initFilter !== undefined) setFt(initFilter);
  }, [initFilter]);

  const adv = STAGE_ADV[form.stage];
  const phNum = parseFloat(form.ph);
  let phNote = null;
  if (!isNaN(phNum) && phNum >= 3 && phNum <= 9) {
    if (phNum < 5.5) phNote = { msg: `pH ${phNum} กรด — เพิ่มโดโลไมด์ 200–500 ก./ต้น`, col: T.amb };
    else if (phNum > 6.5) phNote = { msg: `pH ${phNum} สูงเกิน — ใส่กำมะถัน 50–100 ก./ต้น`, col: T.amb };
    else phNote = { msg: `pH ${phNum} เหมาะสม ✓`, col: T.g };

    .filter(r => {
      if (q && !r.prod.toLowerCase().includes(q.toLowerCase())
            && !(r.note||"").toLowerCase().includes(q.toLowerCase())) return false;
      if (!ft) return true;
      if (ft === "ปุ๋ย") return r.type.includes("ปุ๋ย"); // ครอบคลุมทั้ง ปุ๋ยทางดิน + ปุ๋ยทางใบ

          <FormField label="ระยะใบ">
            <Select value={form.stage} onChange={e=>setForm(f=>({...f,stage:e.target.value}))}>
              <option value="">-- เลือกระยะใบ --</option>
              <optgroup label="ออกใบอ่อน">{["แทงยอด","หางปลา","ใบดาบ","ใบอ่อนตั้ง"].map(s=><option key={s}>{s}</option>)}</optgroup>

            </Select>
          </FormField>
        </div>

        {adv && (
          <div style={{
            background: T.g3, border: `1px solid ${T.bdr2}`,
            borderRadius: 12, padding: "12px 15px", marginBottom: 12,
          }}>

        )}
        <div style={{ display: "flex", gap: 9, marginBottom: 14, flexWrap: "wrap" }}>

// WATER PAGE — THE BIG ONE
// ═══════════════════════════════════════════════════════════════════

function WaterPage({ curMonth }) {
  // ALL numeric inputs use STRING state to fix the "can't delete" bug
  const [spType, setSpType] = useState("cobra180");
  const [flowStr, setFlowStr] = useState("60");
  const [headsStr, setHeadsStr] = useState("2");
  const [ageStr, setAgeStr] = useState("1.5");
  const [treesStr, setTreesStr] = useState("1");
  const [spacingStr, setSpacingStr] = useState("6");
  const [seasonMode, setSeasonMode] = useState("auto"); // auto | dry | rain | flower | fruit

  const sprinkler = SPRINKLER_TYPES.find(s => s.id === spType) || SPRINKLER_TYPES[0];
  const md = MONTH_DATA[curMonth - 1];
  const isRainMonth = md[5] === "rain";

  // Parse numbers (empty = treat as 0 / undefined for calc, but UI keeps the empty string)
  const flow = parseFloat(flowStr) || 0;
  const heads = parseInt(headsStr) || 0;
  const age = parseFloat(ageStr) || 0;
  const trees = parseInt(treesStr) || 1;
  const sp = parseFloat(spacingStr) || 6;

  // Sync flow/heads when sprinkler type changes (but only on type change)
  function changeSprinklerType(newId) {
    setSpType(newId);
    const newSp = SPRINKLER_TYPES.find(s => s.id === newId);
    if (newSp && newId !== "custom") {
      setFlowStr(String(newSp.fDef));
      setHeadsStr(String(newSp.hDef));
    }
  }

  const effectiveSeason = seasonMode === "auto" ? (isRainMonth ? "rain" : "dry") : seasonMode;
  const waterRow = WATER_TABLE.find(w => age >= w[1] && age < w[2]) || WATER_TABLE[WATER_TABLE.length - 1];

  // Tough age cases
  const isFlowerReq = effectiveSeason === "flower";
  const isFruitReq = effectiveSeason === "fruit";
  const tooYoungForFlower = (isFlowerReq || isFruitReq) && age < 4;

  let waterPT = 0;
  if (effectiveSeason === "dry") waterPT = waterRow[3];
  else if (effectiveSeason === "rain") waterPT = waterRow[4];
  else if (effectiveSeason === "flower" && age >= 4) waterPT = 0;
  else if (effectiveSeason === "fruit" && age >= 4) waterPT = waterRow[6] || waterRow[3];

// SVG Sprinkler diagram
function SprinklerDiagram({ sprinkler, heads, headSpacing, fromTrunk }) {
  // Visualize different layouts based on sprinkler.angle and heads count
  const w = 100, h = 60;  // viewBox
  const cx = 50, cy = 35;
  const treeR = 4;

  // Position heads
  let positions = [];
  if (sprinkler.angle === 180 && heads === 2) {
    positions = [
      { x: 18, y: cy, arc: 180, rot: 0 },    // left, facing right
      { x: 82, y: cy, arc: 180, rot: 180 },  // right, facing left
    ];
  } else if (sprinkler.angle === 360 && heads === 1) {
    positions = [{ x: cx, y: cy, arc: 360, rot: 0 }];
  } else if (heads === 4) {
    positions = [
      { x: 25, y: 20, arc: 90, rot: 45 },
      { x: 75, y: 20, arc: 90, rot: 135 },
      { x: 75, y: 50, arc: 90, rot: 225 },
      { x: 25, y: 50, arc: 90, rot: 315 },
    ];
  } else {
    // Generic: spread around tree
    for (let i = 0; i < heads; i++) {
      const a = (i / heads) * Math.PI * 2 - Math.PI/2;
      positions.push({
        x: cx + Math.cos(a) * 30, y: cy + Math.sin(a) * 18,
        arc: sprinkler.angle, rot: (a * 180 / Math.PI) + 180,
      });
    }
  }

  return (
    <div style={{
      marginTop: 4, background: `linear-gradient(135deg, ${T.g3} 0%, ${T.g4} 100%)`,
      border: `1px solid ${T.bdr2}`, borderRadius: 12, padding: "14px 16px",
    }}>
      <div style={{
        fontSize: ".66rem", color: T.txt3, fontWeight: 700,
        letterSpacing: ".08em", textTransform: "uppercase", marginBottom: 8,
        display: "flex", justifyContent: "space-between", alignItems: "center",
      }}>
        <span>แผนผังการติดตั้ง · มุมมองด้านบน</span>
        <span style={{ color: T.sky, fontWeight: 600 }}>{sprinkler.icon} {heads} หัว</span>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "auto", display: "block" }}>
        {/* Spray arcs */}
        {positions.map((p, i) => (
          <g key={i}>
            <SprayArc x={p.x} y={p.y} arc={p.arc} rot={p.rot} radius={26} sprinkler={sprinkler}/>
          </g>
        ))}

        {/* Connection line between heads if 180 */}
        {sprinkler.angle === 180 && heads === 2 && (
          <line x1={positions[0].x} y1={cy} x2={positions[1].x} y2={cy}
                stroke={T.sky} strokeWidth=".5" strokeDasharray="2 2" opacity=".4"/>
        )}

        {/* Tree */}
        <circle cx={cx} cy={cy} r={treeR + 3} fill={T.g3}/>
        <circle cx={cx} cy={cy} r={treeR} fill={T.g}/>
        <text x={cx} y={cy + 1.5} textAnchor="middle" fontSize="4" fill="white" fontWeight="bold">🌿</text>

        {/* Heads */}
        {positions.map((p, i) => (
          <g key={`h${i}`}>
            <circle cx={p.x} cy={p.y} r="2.5" fill={T.sky} stroke="white" strokeWidth=".5"/>
          </g>
        ))}

        {/* Labels: head spacing */}
        {sprinkler.angle === 180 && heads === 2 && (
          <>
            <text x={cx} y={cy + 12} textAnchor="middle" fontSize="3.2" fill={T.txt3}>
              ↔ ระยะห่างหัว {headSpacing} ม.
            </text>
            <text x={positions[0].x} y={positions[0].y - 5} textAnchor="middle" fontSize="2.8" fill={T.sky} fontWeight="bold">180°</text>
            <text x={positions[1].x} y={positions[1].y - 5} textAnchor="middle" fontSize="2.8" fill={T.sky} fontWeight="bold">180°</text>
          </>
        )}
        <text x={cx} y={h - 3} textAnchor="middle" fontSize="2.6" fill={T.txt3}>
          ห่างจากโคน {fromTrunk} ม.
        </text>
      </svg>
    </div>
  );
}

function SprayArc({ x, y, arc, rot, radius, sprinkler }) {
  if (arc === 0) {
    // drip
    return <circle cx={x} cy={y} r="1.5" fill="none" stroke={T.sky} strokeWidth=".4" opacity=".4"/>;
  }
  if (arc === 360) {
    return <circle cx={x} cy={y} r={radius} fill={`${T.sky}10`} stroke={T.sky} strokeWidth=".4" strokeDasharray="1.5 1" opacity=".5"/>;
  }
  // 180° arc — draw as half-circle facing rotation direction
  // Compute arc path
  const startAngle = (rot - arc/2) * Math.PI / 180;
  const endAngle = (rot + arc/2) * Math.PI / 180;
  const x1 = x + Math.cos(startAngle) * radius;
  const y1 = y + Math.sin(startAngle) * radius;
  const x2 = x + Math.cos(endAngle) * radius;
  const y2 = y + Math.sin(endAngle) * radius;
  const largeArc = arc > 180 ? 1 : 0;
  const path = `M ${x} ${y} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
  return <path d={path} fill={`${T.sky}10`} stroke={T.sky} strokeWidth=".4" strokeDasharray="1.5 1" opacity=".5"/>;
}

function PhPage() {
  const [phStr, setPhStr] = useState("");
  const [stage, setStage] = useState("ใบอ่อน");
  const [result, setResult] = useState(null);

  function analyze() {
    const ph = parseFloat(phStr);
    if (isNaN(ph) || ph < 3 || ph > 9) { setResult({ err: "ป้อนค่า 3.0 – 9.0" }); return; }
    const pct = ((ph - 3) / 6 * 100).toFixed(0);
    let msg, col, rec;
    if (ph < 4.5) { msg = "กรดรุนแรงมาก"; col = T.red; rec = "โดโลไมด์ 1–2 กก./ต้น + ปูนขาว 500 ก.–1 กก./ต้น · ทำซ้ำทุก 3 เดือน"; }
    else if (ph < 5.5) { msg = "กรดปานกลาง"; col = T.amb; rec = "โดโลไมด์ 500 ก.–1 กก./ต้น · เพิ่มปุ๋ยอินทรีย์+ฮิวมิค"; }

              💊 <b>วิธีรักษา:</b> {c.rx}
            </div>
          </div>
        ))}
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        <Card title="แมลงศัตรูสำคัญ" icon="🦟" accent={T.amb}>
          {[
            {n:"เพลี้ยไฟ (Thrips palmi)",when:"พ.ค.–มิ.ย. / พ.ย.–ม.ค.",chem:"ไทอะมีทอกแซม (4A), พิโพรนิล (2B)",tip:"พ่นใต้ใบ เช้า 6–9 น. สลับกลุ่มยา",sev:"high"},
            {n:"ไรแดง (Tetranychus)",when:"มี.ค.–มิ.ย. (แล้ง)",chem:"อะบาเมกติน (6) + น้ำมันพาราฟิน",tip:">3 ตัว/ใบ ให้พ่น ห้ามใช้ 3A",sev:"med"},
            {n:"เพลี้ยหอย (Diaspididae)",when:"พ.ย.–เม.ย.",chem:"บูโพเฟซิน (16), ไวต์ออยล์",tip:"พ่นตอน crawler · กำจัดมดด้วย",sev:"med"},
            {n:"เพลี้ยแป้ง",when:"ต.ค.–ก.พ.",chem:"ไทอะมีทอกแซม (4A)",tip:"กำจัดมดก่อน",sev:"med"},
          ].map(p => (
            <div key={p.n} style={{
              background: p.sev==="high" ? T.red2 : T.surf2,
              border: `1px solid ${p.sev==="high" ? "#e8b8b0" : T.bdr}`,
              borderRadius: 12, padding: "11px 14px", marginBottom: 9,
            }}>
              <div style={{ fontWeight: 700, fontSize: ".87rem", marginBottom: 4, color: T.txt }}>🦟 {p.n}</div>
              <div style={{ fontSize: ".75rem", color: T.txt3, marginBottom: 4 }}>📅 {p.when}</div>
              <div style={{ fontSize: ".78rem", color: T.txt2 }}>
                <b>💊 ยา:</b> {p.chem}<br/>
                <b>💡</b> {p.tip}
              </div>
            </div>
          ))}
        </Card>

        <Card title="โรคเชื้อราสำคัญ" icon="🍄" accent={T.gold}>
          {[
            {n:"รากเน่าโคนเน่า (Phytophthora)",sev:"high",when:"มิ.ย.–ต.ค.",rx:"ฟอสอีทิล-Al (33) + เมทาแลคซิล (4) · ไตรโคเดอม่าป้องกัน"},
            {n:"แอนแทรคโนส (Colletotrichum)",sev:"med",when:"ฝน/หลังฝน",rx:"ไดฟีโนโคนาโซล (3) สลับ ไพราโคสโตรบิน (11)"},
            {n:"ราแป้ง/ราน้ำค้าง",sev:"med",when:"เย็น-แล้ง",rx:"กำมะถัน หรือ ไตรฟลอกซีสโตรบิน หรือ FRAC 3"},
            {n:"ราสีชมพู (Corticium)",sev:"high",when:"ฝนชุก",rx:"ทาคอปเปอร์ออกซีคลอไรด์ · ตัดกิ่งเป็นโรค เผาทำลาย"},
          ].map(f => (
            <div key={f.n} style={{
              background: f.sev==="high" ? T.red2 : T.amb2,
              border: `1px solid ${f.sev==="high" ? "#e8b8b0" : "#e8c890"}`,
              borderLeft: `4px solid ${f.sev==="high" ? T.red : T.amb}`,
              borderRadius: 12, padding: "11px 14px", marginBottom: 9,
            }}>
              <div style={{ fontWeight: 700, fontSize: ".87rem", marginBottom: 4, color: T.txt }}>🍄 {f.n}</div>
              <div style={{ fontSize: ".75rem", color: T.txt3, marginBottom: 4 }}>📅 {f.when}</div>
              <div style={{ fontSize: ".78rem", color: T.txt2 }}>{f.rx}</div>
            </div>
          ))}
        </Card>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DurianApp />);
</script>
</body>
</html>
